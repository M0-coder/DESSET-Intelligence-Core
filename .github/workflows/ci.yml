name: Core test and static checks
on:
  push:
    branches:
      - "feature/**"
  pull_request:
permissions:
  contents: read
concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 ref observed 2026-11-23
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 ref observed 2026-11-23
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m compileall -q src tests
      - name: Install pinned coverage tooling
        run: python -m pip install coverage==7.13.3 hypothesis==6.170.17 ruff==0.17.6
      - name: Ruff static analysis
        run: ruff check src tests
      - name: Verify property-test dependencies
        run: python -c "import hypothesis" && ruff --version
      - name: Unit tests and measured coverage
        run: |
          PYTHONPATH=src coverage run --source=src/desset_core -m unittest discover -s tests -v
          coverage report --fail-under=90 -m
      - name: Static syntax and dependency audit
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for source in Path('src').rglob('*.py'):
              ast.parse(source.read_text(encoding='utf-8'))
          print('Parsed every source file; runtime dependencies: Python standard library only')
          PY
