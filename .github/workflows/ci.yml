name: Core test and static checks
on:
  push:
    branches:
      - "feature/**"
  pull_request:
permissions:
  contents: read
concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m compileall -q src tests
      - name: Install pinned coverage tooling
        run: python -m pip install coverage==7.13.3
      - name: Unit tests and measured coverage
        run: |
          PYTHONPATH=src coverage run --source=src/desset_core -m unittest discover -s tests -v
          coverage report --fail-under=90 -m
      - name: Static syntax and dependency audit
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for source in Path('src').rglob('*.py'):
              ast.parse(source.read_text(encoding='utf-8'))
          print('Parsed every source file; runtime dependencies: Python standard library only')
          PY
